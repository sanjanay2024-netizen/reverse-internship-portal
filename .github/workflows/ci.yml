name: Reversed Internship Portal CI

on:
push:
branches:
- main
pull_request:
branches:
- main
workflow_dispatch:

jobs:
build-and-test:
runs-on: ubuntu-latest

steps:
- name: Checkout Repository
uses: actions/checkout@v4

- name: Setup Python
uses: actions/setup-python@v5
with:
python-version: "3.11"

- name: Install Dependencies
run: |
python -m pip install --upgrade pip
if [ -f requirements.txt ]; then
pip install -r requirements.txt
fi
pip install pytest

- name: Check Backend Python Syntax
run: |
python - <<'PY'
from pathlib import Path

files = [
p for p in Path(".").rglob("*.py")
if not any(
part in {".git", ".venv", "venv", "__pycache__"}
for part in p.parts
)
]

if not files:
raise SystemExit(
"No Python files found. Upload the extracted source code."
)

for file in files:
compile(
file.read_text(encoding="utf-8"),
str(file),
"exec"
)

print(f"Python syntax check passed: {len(files)} files")
PY

- name: Check Frontend Files
run: |
if find . -type f \
\( -name "*.html" -o -name "*.css" -o -name "*.js" \) \
-not -path "./.git/*" \
-not -path "./.venv/*" \
-not -path "./venv/*" \
-print -quit | grep -q .; then
echo "Frontend files found"
else
echo "No HTML, CSS, or JavaScript files found"
exit 1
fi

- name: Run Backend Tests
run: |
if find . -type f \
\( -name "test_*.py" -o -name "*_test.py" \) \
-not -path "./.git/*" \
-not -path "./.venv/*" \
-print -quit | grep -q .; then
python -m pytest -v
else
echo "No automated Python tests found"
fi
